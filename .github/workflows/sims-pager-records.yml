name: SIMS pager trial records

on:
  pull_request:
    branches: [main]
    paths:
      - "lean/SimsMeetingThread/**"
      - "lean/SimsMentorFirstThought/**"
      - ".github/workflows/sims-pager-records.yml"
  push:
    branches: [main]
    paths:
      - "lean/SimsMeetingThread/**"
      - "lean/SimsMentorFirstThought/**"
      - ".github/workflows/sims-pager-records.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify restaurant reports and Lean input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 lean/SimsMeetingThread/observations/pager-return/check_records.py
      - name: Check the free reports before the pager question and all mentor clock ticks
        run: python3 -B lean/SimsMentorFirstThought/check_records.py
      - name: Reconstruct all 130 private inputs in the fresh-listener prime sweep
        run: python3 -B lean/SimsMentorFirstThought/prime-sweep/check_sweep.py
      - name: Verify one live traveller across all 26 private turns
        run: python3 -B lean/SimsMentorFirstThought/one-traveller/check_path.py
      - name: Check the unlabelled two-tremble trial records and Lean table
        run: python3 -B lean/SimsMeetingThread/observations/two-trembles/check_records.py
      - name: Check both continuations of every reversed-replay study checkpoint
        run: python3 -B lean/SimsMeetingThread/observations/reversed-replay/check_records.py
      - name: Check the published receipt against the proof inputs
        if: github.event_name == 'push' || hashFiles('lean/SimsMeetingThread/evidence-linux/source.json') != ''
        run: python3 lean/SimsMeetingThread/check_saved_receipt.py
